<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Site</title>
</head>
<body>

<section style="display:flex; align-items:center; gap:48px; padding:60px 40px;">

  <!-- Left: Image -->
  <div style="flex:0 0 45%;">
    <img src="https://thegeekbar.shop/wp-content/uploads/2026/03/Geek-Bar-Gymm.webp" alt="Description" style="width:100%; border-radius:12px; display:block;" />
  </div>

  <!-- Right: Text -->
  <div style="flex:1;">
    <p style="font-size:13px; font-weight:500; color:#3b82f6; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:12px;">Our story</p>
    <h2 style="font-size:28px; font-weight:600; line-height:1.3; margin-bottom:16px;">Your heading goes here</h2>
    <p style="font-size:16px; color:#6b7280; line-height:1.7; margin-bottom:28px;">Your description text goes here. Keep it concise and relevant to your offer.</p>
    <a href="#" class="btn-shop">Shop Now</a>
  </div>

</section>
<style>
  .btn-shop {
    display: inline-block;
    background: #000;
    color: #fff;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 500;
    text-decoration: none;
    border: 2px solid #000;
    transition: background 0.25s, color 0.25s;
  }
  .btn-shop:hover {
    background: transparent;
    color: #000;
  }
</style>

</body>
</html>
